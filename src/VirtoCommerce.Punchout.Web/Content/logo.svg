<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Punchout">
  <title>Punchout</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#5FD080"/>
      <stop offset="100%" stop-color="#2FA85A"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0B4F2A" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Glyph: catalog panel with product circles -->
  <g transform="translate(64,64)" filter="url(#lift)">
    <rect x="-43" y="-43" width="86" height="86" rx="22" fill="#FFFFFF"/>
    <circle cx="-19" cy="-19" r="16" fill="#5FC8F5"/>
    <circle cx="19"  cy="-19" r="16" fill="#9D86F5"/>
    <circle cx="-19" cy="19"  r="16" fill="#3FD8B4"/>
    <circle cx="19"  cy="19"  r="16" fill="#E5484D"/>
  </g>
</svg>
